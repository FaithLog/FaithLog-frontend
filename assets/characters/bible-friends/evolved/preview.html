<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaithLog 진화 캐릭터</title><style>body{font:16px system-ui;color:#494949;background:#faf6e9;max-width:1100px;margin:20px auto;padding:0 14px}select{padding:9px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{padding:12px;background:#fffdf6;border:1px solid #ece8d9;border-radius:16px;text-align:center}.card img{width:136px;height:136px}.card p{font-size:13px;margin:6px}</style></head><body><h1>진화 전신 원화 · 13종</h1><p>진화 후 몸통·귀·뿔·날개가 달라진 192px 투명 SVG 키 포즈를 확인할 수 있습니다.</p><label>진화 단계 <select id="stage"><option value="1">진화 1</option><option value="2" selected>진화 2</option></select></label><label>포즈 <select id="pose"><option>idle</option><option>walk-left</option><option>walk-right</option><option>feed</option><option>play</option><option>sleep</option><option>wake</option></select></label><div class="grid" id="grid"></div><script>const chars=[["david-lamb","다윗의 양"],["noah-bear","노아의 곰"],["jonah-whale","요나의 고래"],["daniel-lion","다니엘의 사자"],["peace-dove","평화의 비둘기"],["hope-rabbit","소망 토끼"],["word-fox","말씀 여우"],["gentle-deer","온유 사슴"],["companion-donkey","동행 당나귀"],["joy-chick","기쁨 병아리"],["peace-penguin","평안 펭귄"],["love-otter","사랑 수달"],["patience-turtle","인내 거북이"]];const grid=document.getElementById('grid');grid.innerHTML=chars.map(c=>'<div class="card"><img alt=""><p>'+c[1]+'</p></div>').join('');function draw(){const stage=document.getElementById('stage').value,pose=document.getElementById('pose').value;chars.forEach((c,i)=>grid.children[i].querySelector('img').src=c[0]+'/stage-'+stage+'/'+pose+'.svg');}document.querySelectorAll('select').forEach(x=>x.addEventListener('change',draw));draw();</script></body></html>

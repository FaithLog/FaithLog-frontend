<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FaithLog Lv2/Lv3 animation atlas</title><style>body{font:16px system-ui;background:#faf6e9;color:#494949;max-width:900px;margin:20px auto;padding:10px}select,button{padding:10px;border:1px solid #ddd2b9;border-radius:9px;background:white}.samples{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.cell{width:182px;height:182px;border-radius:16px;background:#fffdf6;border:1px solid #ece8d9;display:grid;place-items:center}.sprite{width:160px;height:160px;position:relative;overflow:hidden}.sprite img{position:absolute;width:640px;height:640px;max-width:none}small{display:block;text-align:center;color:#746b60}</style></head><body><h2>FaithLog 진화 전용 원화 26종</h2><p>실제 PNG 아틀라스에서 움직이는 프레임을 직접 확인합니다.</p><select id="species"><option value="david-lamb">다윗의 양</option><option value="noah-bear">노아의 곰</option><option value="jonah-whale">요나의 고래</option><option value="daniel-lion">다니엘의 사자</option><option value="peace-dove">평화의 비둘기</option><option value="hope-rabbit">소망 토끼</option><option value="word-fox">말씀 여우</option><option value="gentle-deer">온유 사슴</option><option value="companion-donkey">동행 당나귀</option><option value="joy-chick">기쁨 병아리</option><option value="peace-penguin">평안 펭귄</option><option value="love-otter">사랑 수달</option><option value="patience-turtle">인내 거북이</option></select> <select id="motion"><option>idle</option><option>walk</option><option>happy</option><option>held</option><option>land</option></select><button id="toggle">일시정지</button><div class="samples"><div><div class="cell"><div class="sprite"><img id="a" alt="1차 진화"></div></div><small>Lv2 · 1차 진화</small></div><div><div class="cell"><div class="sprite"><img id="b" alt="2차 진화"></div></div><small>Lv3 · 2차 진화</small></div></div><a href="./contact-sheet.jpg">13종 × 2단계 전체 원화 비교 이미지</a><p>알아둘 점: 프레임들은 26종 일러스트의 회전·이동·크기 변환으로 생성했습니다.</p><script>const motion={idle:[0,1,2,3],walk:[4,5,6,7],happy:[8,9,10,11],held:[12,13],land:[14,15]};let step=0,playing=true;const s=document.getElementById('species'),m=document.getElementById('motion'),a=document.getElementById('a'),b=document.getElementById('b');function show(){const f=motion[m.value][step%motion[m.value].length];for(const [im,l] of [[a,2],[b,3]]){const file=s.value+'-lv'+l+'.png';if(im.getAttribute('src')!==file)im.src=file;im.style.left=(-(f%4)*160)+'px';im.style.top=(-Math.floor(f/4)*160)+'px'}}setInterval(()=>{if(playing){step++;show()}},185);document.getElementById('toggle').onclick=()=>{playing=!playing;document.getElementById('toggle').textContent=playing?'일시정지':'재생'};s.onchange=m.onchange=()=>{step=0;show()};show();</script></body></html>

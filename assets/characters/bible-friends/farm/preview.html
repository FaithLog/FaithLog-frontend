<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaithLog farm overlay preview</title><style>body{background:#faf6e9;color:#494949;font:15px system-ui,sans-serif;margin:24px}header{display:flex;gap:14px;flex-wrap:wrap;align-items:center}select{font:inherit;padding:8px 14px;background:white;border:1px solid #d2cbbb;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:22px}.card{background:#fffdf6;border:1px solid #ece8d9;border-radius:16px;padding:13px;text-align:center}.sprite{width:134px;height:134px;position:relative;margin:auto}.sprite img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.title{font-weight:600;margin:6px 0 2px}.caption{font-size:12px;color:#82796e}</style></head><body><h1>동물농장 · 돌봄/진화 SVG 에셋 확인</h1><p>원본 캐릭터 PNG를 유지한 채 위에 이펙트와 성장 장식을 더한 모습입니다. 영구 상태 저장은 구현되지 않았습니다.</p><header><label>진화 단계 <select id="stage"><option value="0">기본형</option><option value="1">1단계 장식</option><option value="2" selected>2단계 장식</option></select></label><label>돌봄 모션 <select id="action"><option value="">없음</option><option value="feed">먹이 주기</option><option value="play">공놀이</option><option value="sleep">잠자기</option><option value="dirty">배변 및 오염</option><option value="clean">청소</option><option value="pet">쓰다듬기</option><option value="hungry">배고픔</option><option value="sick">아픔</option><option value="faint">기절</option><option value="evolve">진화 이펙트</option></select></label></header><div id="cards" class="grid"></div><script>const names=["david-lamb","noah-bear","jonah-whale","daniel-lion","peace-dove","hope-rabbit","word-fox","gentle-deer","companion-donkey","joy-chick","peace-penguin","love-otter","patience-turtle"];const motions={"feed":{"frames":4,"frameMs":190,"loop":false,"label":"먹이 주기"},"play":{"frames":4,"frameMs":180,"loop":false,"label":"공놀이"},"sleep":{"frames":4,"frameMs":550,"loop":true,"label":"잠자기"},"dirty":{"frames":4,"frameMs":420,"loop":true,"label":"배변 및 오염"},"clean":{"frames":4,"frameMs":180,"loop":false,"label":"청소"},"pet":{"frames":4,"frameMs":230,"loop":false,"label":"쓰다듬기"},"hungry":{"frames":4,"frameMs":450,"loop":true,"label":"배고픔"},"sick":{"frames":4,"frameMs":400,"loop":true,"label":"아픔"},"faint":{"frames":4,"frameMs":360,"loop":true,"label":"기절"},"evolve":{"frames":8,"frameMs":140,"loop":false,"label":"진화 이펙트"}};const root=document.getElementById('cards'),stage=document.getElementById('stage'),action=document.getElementById('action');root.innerHTML=names.map(id=>'<div class="card"><div class="sprite"><img alt="" src="../motions/'+id+'/idle-0.png"><img class="evo" alt=""><img class="care" alt=""></div><div class="title">'+id+'</div><div class="caption">192×192 투명 SVG 레이어</div></div>').join('');let start=performance.now();function render(t){const s=stage.value,a=action.value;for(let j=0;j<names.length;j++){const rootEl=root.children[j],id=names[j],e=rootEl.querySelector('.evo'),c=rootEl.querySelector('.care');e.style.display=s==='0'?'none':'';const ep='evolution/'+id+'/stage-'+s+'.svg';if(s!=='0'&&e.getAttribute('src')!==ep)e.src=ep;if(!a){c.style.display='none';continue;}c.style.display='';const m=motions[a],n=Math.floor((t-start)/m.frameMs),ix=m.loop?n%m.frames:Math.min(n,m.frames-1),file='actions/'+a+'-'+ix+'.svg';if(c.getAttribute('src')!==file)c.src=file;}requestAnimationFrame(render)}stage.onchange=()=>{start=performance.now()};action.onchange=()=>{start=performance.now()};requestAnimationFrame(render);</script></body></html>

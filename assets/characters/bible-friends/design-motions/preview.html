<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaithLog 전체 디자인 모션</title><style>body{margin:0;background:#faf6e9;color:#403932;font:15px system-ui}header{position:sticky;top:0;background:#faf6e9ed;padding:18px;z-index:1;border-bottom:1px solid #ddd5c1}h1{font-size:23px;margin:0 0 10px}select,button{font:inherit;padding:8px;margin:4px;border:1px solid #cfc5b2;border-radius:10px;background:#fffdf6}main{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}article{background:#fffdf6;border:1px solid #e4dccb;border-radius:16px;padding:12px;text-align:center}.sprite{margin:auto;width:128px;height:128px;overflow:hidden;position:relative}.sprite img{position:absolute;max-width:none;image-rendering:pixelated}small{display:block;color:#827263}p{margin:5px}#status{font-size:13px}</style><header><h1>FaithLog · 130종 전체 모션</h1><label>캐릭터 <select id="species"><option value="">전체</option></select></label><label>의상 <select id="styles"><option value="">전체</option></select></label><label>모션 <select id="motion"><option value="idle">대기·호흡</option><option value="walk">걷기</option><option value="happy">터치·기쁨</option><option value="held">들려 있기</option><option value="land">착지</option></select></label><button id="replay">다시 재생</button><button id="pause">일시정지</button><p id="status" role="status">불러오는 중…</p><small>개발 확인용. 캐릭터별 크기·여백과 의상 유지 여부를 확인합니다.</small></header><main></main><script type="module">
const [atlas,catalog,basic]=await Promise.all(['manifest.json','../designs/manifest.json','../motions/manifest.json'].map(p=>fetch(p).then(r=>r.json())));
const $=s=>document.querySelector(s), maps=new Map(atlas.designs.map(d=>[d.id,d])), basicMap=new Map(basic.characters.map(d=>[d.id,d]));
for(const s of catalog.species)$('#species').add(new Option(s.name,s.id));for(const s of catalog.styles)$('#styles').add(new Option(s.name,s.id));
let actors=[],start=performance.now(),paused=false,pausedAt=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced){paused=true;pausedAt=start;$('#pause').textContent='재생';}
function render(){actors=[];$('main').replaceChildren();let designs=catalog.designs.filter(d=>(!$('#species').value||d.friendId===$('#species').value)&&(!$('#styles').value||d.styleId===$('#styles').value));for(const d of designs){let card=document.createElement('article'),box=document.createElement('div'),img=document.createElement('img'),p=document.createElement('p'),small=document.createElement('small');box.className='sprite';img.alt=d.name;p.textContent=d.name;small.textContent=d.rarity;box.append(img);card.append(box,p,small);$('main').append(card);let a=maps.get(d.id);if(a){img.src=a.file;img.style.width='512px';img.style.height='512px';}else{img.style.width='128px';img.style.height='128px';img.style.left='0px';img.style.top='0px';}actors.push({d,img,atlas:!!a});}$('#status').textContent=designs.length+'종 · 총 130종 / 2,080프레임';start=performance.now();if(paused)pausedAt=start;}
for(const id of['species','styles'])$('#'+id).onchange=render;$('#motion').onchange=()=>{start=performance.now();if(paused)pausedAt=start;};$('#replay').onclick=()=>{start=performance.now();if(paused)pausedAt=start;};$('#pause').onclick=()=>{let now=performance.now();if(paused){start+=now-pausedAt;}else pausedAt=now;paused=!paused;$('#pause').textContent=paused?'재생':'일시정지';};
function tick(now){let motion=$('#motion').value,m=atlas.motions[motion],total=m.durationsMs.reduce((a,b)=>a+b,0),elapsed=(paused?pausedAt:now)-start,t=m.loop?elapsed%total:Math.min(elapsed,total-1),index=0;while(index<m.durationsMs.length-1&&t>=m.durationsMs[index]){t-=m.durationsMs[index];index++;}for(const a of actors){if(a.atlas){let slot=m.offset+index;a.img.style.left=-(slot%4)*128+'px';a.img.style.top=-Math.floor(slot/4)*128+'px';}else{let f=basicMap.get(a.d.friendId).animations[motion].frames[index].file,src='../motions/'+f;if(!a.img.src.endsWith('/'+f))a.img.src=src;}}requestAnimationFrame(tick);}render();requestAnimationFrame(tick);
</script></html>

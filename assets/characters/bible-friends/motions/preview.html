art}document.querySelector('#motion').onchange=replay;document.querySelector('#replay').onclick=replay;document.querySelector('#pause').onclick=e=>{if(paused){start+=performance.now()-pauseTime;paused=false;e.target.textContent='멈춤'}else{paused=true;pauseTime=performance.now();e.target.textContent='재생'}};requestAnimationFrame(tick);</script></html>

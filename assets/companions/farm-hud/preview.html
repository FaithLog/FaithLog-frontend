<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaithLog Farm HUD assets</title><style>*{box-sizing:border-box}body{background:#F7F8FA;color:#191F28;font:15px system-ui,-apple-system,sans-serif;max-width:1080px;margin:0 auto;padding:24px}header{padding:12px 0 20px}h1{font-size:24px;margin:0 0 9px}p{color:#4E5968}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.card{background:#fff;border:1px solid #EEF1F4;border-radius:18px;text-align:center;padding:12px}.card img{width:90px;height:90px;object-fit:contain}.card small{font-size:12px;color:#4E5968;display:block;word-break:break-all}section{margin:30px 0}main{max-width:1080px} .sample{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #EEF1F4;border-radius:14px;background:white;min-width:85px;padding:10px;text-align:center}.btn.active{background:#E8F3FF;border-color:#2368D3}.btn img{width:40px;height:40px}.btn span{display:block;font-size:12px}.gauge{width:min(300px,100%);padding:12px;background:#fff;border-radius:14px;border:1px solid #EEF1F4}.meter{height:8px;background:#EEF1F4;border-radius:10px;overflow:hidden}.meter b{display:block;height:100%;background:#2E7078;width:65%}a{color:#2368D3}</style></head><body><header><h1>FaithLog 동물농장 HUD</h1><p>실제 FaithLog 기본 테마(#2368D3 블루 / #2E7078 청록)와 일치하도록 제작한 투명 PNG 및 SVG 아이콘.</p></header><section><h2>돌봄 버튼 예시</h2><div class="sample" id="action-demo"></div></section><section><h2>상태 게이지 예시</h2><div class="gauge"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><img src="status-hunger.png" width="26" height="26"><span style="flex:1">배부름</span><b>65%</b></div><div class="meter"><b></b></div></div><p>실제 앱의 상태 수치와 게이지는 React Native 컴포넌트에서 동적으로 표현합니다.</p></section><section><h2>전체 아이콘</h2><div id="grid" class="grid"></div></section><script>const names=['action-feed','action-pet','action-play','action-clean','action-sleep','action-evolve','status-hunger','status-affection','status-cleanliness','status-health','status-joy','state-hungry','state-dirty','state-sick','state-sleepy','state-happy','state-selected','fx-heart','fx-sparkles','fx-clean','fx-evolve','badge-lv1','badge-lv2','badge-lv3'];document.querySelector('#grid').innerHTML=names.map(n=>`<div class="card"><img src="${n}.png" alt=""><small>${n}</small></div>`).join('');const labels=['먹이','쓰다듬기','놀이','청소','수면','진화'];document.querySelector('#action-demo').innerHTML=names.slice(0,6).map((n,i)=>`<div class="btn ${i===0?'active':''}"><img src="${n}.png" alt=""><span>${labels[i]}</span></div>`).join('');</script></body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>FaithLog · 동물 친구 뽑기 애니메이션</title>
<style>body{margin:0;background:#F7F8FA}button,select{cursor:pointer}button:disabled,select:disabled{cursor:default}</style>
</head>
<body>
<div id="fl-draw-polished" class="viz-dotted-background">
<style>
#fl-draw-polished{padding:20px 8px;font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}#fl-draw-polished *{box-sizing:border-box}.fl-phone{max-width:390px;margin:auto;background:#F7F8FA;color:#191F28;border-radius:24px;padding:24px;overflow:hidden}.fl-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:32px}.fl-brand{font-weight:700;letter-spacing:2px}.fl-title{text-align:center;font-size:24px;line-height:32px;font-weight:700;margin:0 0 8px}.fl-sub{text-align:center;font-size:13px;opacity:.7;margin:0}.fl-stage{position:relative;height:330px;display:grid;place-items:center}.fl-stage canvas{width:100%;height:100%;object-fit:contain}.fl-status{min-height:46px;text-align:center;font-size:14px;padding:8px}.fl-controls{display:flex;gap:10px}.fl-controls button,.fl-again{font:inherit;border:0;border-radius:14px;min-height:48px;padding:12px 16px;flex:1;font-weight:600}.fl-controls button:first-child{background:#E8F3FF;color:#2368D3}.fl-controls button:last-child,.fl-again{background:#2368D3;color:#FFFFFF}.fl-controls button:disabled{opacity:.45}.fl-note{text-align:center;font-size:11px;opacity:.65;margin:16px 0 0}.fl-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:8px 0 18px}.fl-item{text-align:center;animation:fl-pop .3s both;min-width:0}.fl-item canvas{width:100%;height:100px;object-fit:contain;background:#FFFFFF;border-radius:12px;display:block}.fl-item span{display:block;font-size:13px;white-space:normal;margin-top:8px}.fl-item b{font-size:11px;font-weight:500;color:#2E7078}.fl-results.single{grid-template-columns:1fr;max-width:160px;margin:0 auto 18px}.fl-results.single canvas{height:160px}.fl-results.single span{font-size:15px}.fl-results.single b{font-size:12px}.fl-again{width:100%;display:block}.fl-hidden{display:none!important}@keyframes fl-pop{from{opacity:0;transform:translateY(12px) scale(.8)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.fl-item{animation:none}}

.fl-preview{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;font-size:12px;color:#4E5968}.fl-preview select{max-width:170px;min-height:44px;border:1px solid #EEF1F4;border-radius:12px;padding:8px;background:#FFFFFF;color:#191F28;font:inherit}.fl-item[data-rarity="rare"] canvas{background:#F1ECFC;box-shadow:inset 0 0 0 1px #CEBDEF}.fl-item[data-rarity="unique"] canvas{background:#FFF4DB;box-shadow:inset 0 0 0 1px #E4C67B}.fl-item[data-rarity="rare"] b{color:#7852AF}.fl-item[data-rarity="unique"] b{color:#946313}.fl-stage{border-radius:24px;margin-top:12px;background:#FFFFFF}.fl-status{font-weight:600}.fl-stage canvas{border-radius:24px}
.fl-stage{background:linear-gradient(160deg,#FFFFFF,#F2F9FA);box-shadow:0 12px 36px #2E70780A;isolation:isolate}.fl-top{margin-bottom:24px}.fl-brand{letter-spacing:0;font-weight:600}.fl-results{gap:14px 10px}.fl-item canvas{border-radius:18px}.fl-controls button{transition:transform .18s,background .18s}.fl-controls button:active{transform:scale(.97)}.fl-status{min-height:56px;display:grid;place-items:center;color:#4E5968;font-size:13px}.fl-scene-label{position:absolute;left:0;right:0;top:24px;text-align:center;pointer-events:none;z-index:2}.fl-scene-label b{display:inline-block;font-size:11px;letter-spacing:2px;font-weight:600;color:#2E7078}.fl-scene-label span{display:block;font-size:18px;font-weight:700;color:#191F28;margin-top:7px}.fl-sequence{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}.fl-sequence i{width:6px;height:6px;border-radius:50%;background:#D7E3E6;transition:background .2s,transform .2s}.fl-sequence i.active{background:#2368D3;transform:scale(1.4)}.fl-skip{background:none;border:0;color:#4E5968;min-height:44px;padding:8px 12px;font:inherit;font-size:12px;position:absolute;bottom:7px;right:8px;z-index:4}.fl-stage canvas{position:absolute;inset:0}.fl-stage .fl-skip{font-size:11px}.fl-item{animation:fl-pop .45s cubic-bezier(.2,.8,.2,1) both}
</style>
<div class="fl-phone">
<div class="fl-top"><span class="fl-brand">동물 친구 뽑기</span></div>
<h2 class="fl-title">새로운 친구를 만나보세요</h2><p class="fl-sub">오늘도 믿음의 여정을 함께할 친구</p>
<label class="fl-preview">연출 미리보기<select aria-label="확인할 등장 연출"><option value="unique">유니크 등장</option><option value="rare">희귀 등장</option><option value="normal">일반 등장</option></select></label>
<div class="fl-stage"><div class="fl-scene-label"><b>HELLO, LITTLE FRIEND</b><span>작은 알에 담긴 설렘</span></div><div class="fl-sequence"></div><button type="button" class="fl-skip fl-hidden cursor-interaction">건너뛰기</button><canvas width="700" height="660" aria-label="알이 열리고 동물 친구가 등장하는 애니메이션" role="img"></canvas></div>
<div class="fl-status" aria-live="polite">설레는 만남을 시작해 보세요</div>
<div class="fl-results fl-hidden"></div>
<div class="fl-controls"><button type="button" class="cursor-interaction" data-count="1">1개 뽑기</button><button type="button" class="cursor-interaction" data-count="10">10개 뽑기</button></div>
<button type="button" class="fl-again fl-hidden cursor-interaction">다시 뽑기</button>
<p class="fl-note">임시 캐릭터 · 선택한 등급 연출 시연 · 실제 확률 미적용</p>
</div>
<script>
(()=>{const root=document.getElementById('fl-draw-polished'),canvas=root.querySelector('.fl-stage canvas'),ctx=canvas.getContext('2d'),status=root.querySelector('.fl-status'),results=root.querySelector('.fl-results'),controls=root.querySelector('.fl-controls'),again=root.querySelector('.fl-again');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let busy=false;const friends=[{name:'다윗의 양',kind:0},{name:'소망 토끼',kind:1},{name:'노아의 곰',kind:2},{name:'기쁨 병아리',kind:3}];
function animal(c,x,y,s,f,unique){c.save();c.translate(x,y);c.scale(s,s);const p=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};let fur=['#fff9e9','#f6e7d9','#bf8e68','#f6d16d'][f.kind],outline='#615342';p(-25,-17,50,38,outline);p(-30,-12,60,28,outline);p(-25,-12,50,28,fur);p(-20,-17,40,38,fur);if(f.kind===0){for(let i=-24;i<25;i+=12){p(i,-24,10,14,fur);p(i,14,10,11,fur)}p(-17,-5,34,26,'#ecd1b1');p(-31,-7,10,12,'#d6b69a');p(21,-7,10,12,'#d6b69a')}if(f.kind===1){p(-21,-49,13,34,outline);p(8,-49,13,34,outline);p(-18,-46,7,30,fur);p(11,-46,7,30,fur);p(-16,-42,3,20,'#dda5a4');p(13,-42,3,20,'#dda5a4')}if(f.kind===2){p(-27,-28,16,17,outline);p(11,-28,16,17,outline);p(-24,-25,10,13,fur);p(14,-25,10,13,fur);p(-12,3,24,15,'#eed7b7')}p(-15,-2,5,7,outline);p(10,-2,5,7,outline);p(-15,-2,2,2,'#ffffff');p(10,-2,2,2,'#ffffff');p(-23,7,8,4,'#e9aaa0');p(15,7,8,4,'#e9aaa0');p(-3,7,6,4,f.kind===3?'#db8a3e':outline);p(-17,23,12,7,outline);p(6,23,12,7,outline);if(unique){p(-22,-33,44,9,'#e6b952');p(-22,-43,8,15,'#e6b952');p(-4,-48,8,20,'#e6b952');p(14,-43,8,15,'#e6b952');p(-3,-31,6,5,'#a8b6d5')}c.restore()}
const modes={normal:{ink:'#71B8C3',soft:'#E8F6F7',deep:'#2E7078',label:'일반',en:'A NEW FRIEND'},rare:{ink:'#AB8CE6',soft:'#EEE6FC',deep:'#7852AF',label:'희귀',en:'RARE FRIEND'},unique:{ink:'#E1BD68',soft:'#FFF0CD',deep:'#946313',label:'유니크',en:'UNIQUE FRIEND'}};
const picker=root.querySelector('select'),stage=root.querySelector('.fl-stage'),heading=root.querySelector('.fl-scene-label'),sequence=root.querySelector('.fl-sequence'),skip=root.querySelector('.fl-skip');let skipRequested=false;
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
function star(x,y,size,rotation,color,alpha=1){ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.globalAlpha=clamp(alpha);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,-size);ctx.quadraticCurveTo(size*.2,-size*.2,size,0);ctx.quadraticCurveTo(size*.2,size*.2,0,size);ctx.quadraticCurveTo(-size*.2,size*.2,-size,0);ctx.quadraticCurveTo(-size*.2,-size*.2,0,-size);ctx.fill();ctx.restore()}
function scene(mode,t,energy=0){const m=modes[mode];ctx.clearRect(0,0,700,660);const bg=ctx.createLinearGradient(0,0,700,660);bg.addColorStop(0,'#FFFFFF');bg.addColorStop(1,'#F0F7F8');ctx.fillStyle=bg;ctx.fillRect(0,0,700,660);const halo=ctx.createRadialGradient(350,320,0,350,320,265);halo.addColorStop(0,m.soft);halo.addColorStop(.6,m.soft+'99');halo.addColorStop(1,m.soft+'00');ctx.fillStyle=halo;ctx.fillRect(0,0,700,660);
// Quiet drifting dust and an elliptical ground plane.
for(let i=0;i<23;i++){const x=70+(i*137)%570,y=130+(i*89)%410-Math.sin(t*.001+i)*7;ctx.fillStyle=m.ink;ctx.globalAlpha=.12+(i%3)*.07;ctx.beginPath();ctx.arc(x,y,i%4===0?2.5:1.5,0,7);ctx.fill()}ctx.globalAlpha=1;const floor=ctx.createRadialGradient(350,473,0,350,473,150);floor.addColorStop(0,m.ink+'30');floor.addColorStop(1,m.ink+'00');ctx.save();ctx.translate(350,473);ctx.scale(1,.22);ctx.fillStyle=floor;ctx.translate(-350,-473);ctx.fillRect(180,300,340,340);ctx.restore();ctx.save();ctx.strokeStyle=m.ink;ctx.globalAlpha=.16+energy*.17;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(350,473,126+energy*30,27,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function shellPath(){ctx.beginPath();ctx.moveTo(0,-112);ctx.bezierCurveTo(56,-112,98,8,88,57);ctx.bezierCurveTo(80,115,-80,115,-88,57);ctx.bezierCurveTo(-98,8,-56,-112,0,-112);ctx.closePath()}
function shellFill(){const g=ctx.createLinearGradient(-88,-70,88,80);g.addColorStop(0,'#FFFFFF');g.addColorStop(.48,'#FFFDF8');g.addColorStop(1,'#DCEBED');ctx.fillStyle=g;shellPath();ctx.fill();ctx.strokeStyle='#BDD8DB';ctx.lineWidth=2.5;ctx.stroke();ctx.save();shellPath();ctx.clip();for(const [x,y,r]of [[-31,-26,12],[29,26,16],[-29,72,8],[13,-73,7]]){ctx.fillStyle='#92C7CF';ctx.beginPath();ctx.ellipse(x,y,r,r*.8,-.4,0,7);ctx.fill()}const shine=ctx.createLinearGradient(-70,0,20,0);shine.addColorStop(0,'#FFFFFF00');shine.addColorStop(.55,'#FFFFFFCC');shine.addColorStop(1,'#FFFFFF00');ctx.fillStyle=shine;ctx.translate(-28,0);ctx.rotate(.2);ctx.fillRect(-17,-120,23,240);ctx.restore()}
function crackPath(){ctx.beginPath();ctx.moveTo(-86,13);ctx.lineTo(-58,-1);ctx.lineTo(-34,19);ctx.lineTo(-8,-3);ctx.lineTo(17,15);ctx.lineTo(41,-5);ctx.lineTo(66,13);ctx.lineTo(88,2)}
function egg(x,y,angle,crack=0,opening=0,mode='normal',scale=1){const m=modes[mode];ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);
if(opening>0){for(const side of [-1,1]){ctx.save();const k=ease(opening);ctx.translate(side*k*106,side<0?-k*155:k*70);ctx.rotate(side*k*.55);ctx.globalAlpha=1-smooth((opening-.55)/.45);ctx.beginPath();if(side<0){ctx.moveTo(-120,-160);ctx.lineTo(120,-160);ctx.lineTo(120,13)}else{ctx.moveTo(-120,160);ctx.lineTo(120,160);ctx.lineTo(120,13)}ctx.lineTo(88,2);ctx.lineTo(66,13);ctx.lineTo(41,-5);ctx.lineTo(17,15);ctx.lineTo(-8,-3);ctx.lineTo(-34,19);ctx.lineTo(-58,-1);ctx.lineTo(-86,13);ctx.lineTo(-120,13);ctx.closePath();ctx.clip();shellFill();ctx.restore()}}else{shellFill();if(crack>0){ctx.save();shellPath();ctx.clip();ctx.strokeStyle=m.ink;ctx.shadowColor=m.ink;ctx.shadowBlur=14*crack;ctx.lineWidth=4;ctx.setLineDash([210*clamp(crack),500]);crackPath();ctx.stroke();ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}}ctx.restore()}
function orbit(mode,t,p){const m=modes[mode];for(let i=0;i<26;i++){const phase=i*2.399,travel=clamp((p-.05-(i%5)*.025)/.75),r=210*(1-travel)+20;const angle=phase+travel*1.7;star(350+Math.cos(angle)*r,330+Math.sin(angle)*r*.8,2+(i%4),phase+t*.0003,m.ink,Math.sin(travel*Math.PI)*.8)}ctx.save();ctx.translate(350,330);ctx.rotate(-.35+p*.5);ctx.strokeStyle=m.ink;ctx.globalAlpha=.25*Math.sin(p*Math.PI);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,135,42,0,0,Math.PI*1.5);ctx.stroke();ctx.restore()}
function burst(mode,t,p){const m=modes[mode];const unique=mode==='unique',n=unique?52:mode==='rare'?32:16;
if(mode!=='normal'){ctx.save();ctx.translate(350,330);ctx.rotate(p*.18);ctx.fillStyle=m.ink;ctx.globalAlpha=(unique?.15:.08)*(1-smooth(p));for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-22,-310);ctx.lineTo(22,-310);ctx.closePath();ctx.fill()}ctx.restore()}
for(let j=0;j<2;j++){const v=clamp((p-j*.12)/.8);ctx.save();ctx.strokeStyle=m.ink;ctx.globalAlpha=(1-v)*.5;ctx.lineWidth=3-j;ctx.beginPath();ctx.arc(350,330,40+ease(v)*215,0,7);ctx.stroke();ctx.restore()}
for(let i=0;i<n;i++){const a=i*2.399,r=35+ease(p)*(100+(i%7)*20),x=350+Math.cos(a)*r,y=330+Math.sin(a)*r*.85+p*p*35;star(x,y,(i%4+3)*(1-p*.65),a+p*2,m.ink,Math.sin(Math.PI*clamp(p*1.3))*.85)}
// Curved glints linger around the character after the burst.
for(let i=0;i<7;i++){const a=i*2.4+p*.4;star(350+Math.cos(a)*145,315+Math.sin(a)*125,4+Math.sin(p*5+i)*2,a,m.ink,smooth((p-.35)/.25)*.7)}
}
function shards(mode,p){ctx.save();ctx.fillStyle='#F7FBFA';ctx.strokeStyle='#BDD8DB';ctx.lineWidth=1.5;for(let i=0;i<8;i++){ctx.save();const a=i*Math.PI/4;ctx.translate(350+Math.cos(a)*(65+p*155),330+Math.sin(a)*p*135+p*p*130);ctx.rotate(i+p*(i%2?3:-3));ctx.globalAlpha=1-smooth((p-.25)/.65);ctx.beginPath();ctx.moveTo(-7,-6);ctx.lineTo(9,-3);ctx.lineTo(3,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}ctx.restore()}
function label(top,bottom,color='#2E7078'){heading.querySelector('b').textContent=top;heading.querySelector('b').style.color=color;heading.querySelector('span').textContent=bottom}
function animate(ms,draw){return new Promise(resolve=>{let origin;function tick(t){origin??=t;const p=clamp((t-origin)/(reduced?80:ms));draw(reduced?1:p,t);if(p===1||skipRequested)resolve();else requestAnimationFrame(tick)}requestAnimationFrame(tick)})}
function idle(){scene('normal',0);egg(350,337,0);label('HELLO, LITTLE FRIEND','작은 알에 담긴 설렘')}
function friendPose(f,p){const m=modes[f.rarity];const v=clamp((p-.17)/.48),landing=clamp((v-.72)/.28),bounce=Math.sin(landing*Math.PI)*12;const y=410-Math.sin(v*Math.PI)*103-bounce;const squash=v<.72?1:1-Math.sin(landing*Math.PI)*.1;ctx.save();ctx.globalAlpha=ease(v*4);ctx.translate(350,y);ctx.scale(1/squash,squash);animal(ctx,0,0,2.35*(.85+ease(v)*.15),f,f.rarity==='unique');ctx.restore();if(f.rarity==='rare'&&v>0){star(350, y+35,10,0,m.ink,ease(v))}}
async function hatch(f,index,total){const m=modes[f.rarity],special=f.rarity!=='normal';sequence.querySelectorAll('i').forEach((dot,i)=>dot.classList.toggle('active',i===index));status.textContent=total>1?(index+1)+' / '+total+' · 친구를 만나고 있어요':'알 속에서 작은 기척이 느껴져요';
label('A LITTLE MIRACLE','두근두근, 누가 있을까요?');
await animate(total>1?360:800,(p,t)=>{scene('normal',t,p);egg(350,337-Math.sin(p*Math.PI)*9,Math.sin(p*Math.PI*4)*.045*Math.sin(p*Math.PI));});if(skipRequested)return;
label(special?'SOMETHING SPECIAL':'ALMOST THERE',special?'조금 특별한 빛이 보여요':'곧 만날 수 있어요',m.deep);
await animate(special?1250:500,(p,t)=>{scene(p>.25?f.rarity:'normal',t,p);orbit(f.rarity,t,p);const hold=p>.82?0:Math.sin(p*29)*.075*smooth(p*2);const squash=1-Math.sin(p*Math.PI)*.035;ctx.save();ctx.translate(350,337);ctx.scale(1/squash,squash);egg(0,-ease(p)*13,hold,clamp((p-.35)/.5),0,f.rarity);ctx.restore()});if(skipRequested)return;
label(m.en,special?'특별한 친구가 찾아왔어요':'반가워요, 새로운 친구!',m.deep);status.textContent=m.label+' · '+f.name;
await animate(f.rarity==='unique'?2300:f.rarity==='rare'?1800:950,(p,t)=>{scene(f.rarity,t,1);if(!reduced){burst(f.rarity,t,p);shards(f.rarity,clamp(p*1.6))}if(p>.17)friendPose(f,reduced?1:p);if(p<.6&&!reduced)egg(350,324,0,1,clamp(p/.6),f.rarity);if(p>.73){ctx.save();ctx.globalAlpha=smooth((p-.73)/.2);ctx.font='500 23px system-ui';ctx.textAlign='center';ctx.fillStyle=m.deep;ctx.fillText(f.name,350,550);ctx.restore()}})
}
async function start(count){if(busy)return;busy=true;skipRequested=false;picker.disabled=true;controls.querySelectorAll('button').forEach(b=>b.disabled=true);results.replaceChildren();results.classList.add('fl-hidden');again.classList.add('fl-hidden');stage.classList.remove('fl-hidden');skip.classList.remove('fl-hidden');sequence.replaceChildren();if(count===10)for(let i=0;i<10;i++)sequence.append(document.createElement('i'));
const list=Array.from({length:count},()=>({...friends[Math.floor(Math.random()*friends.length)],rarity:'normal'}));list[count===1?0:7].rarity=picker.value;
if(count===10){label('TEN LITTLE SURPRISES','열 번의 설레는 만남');await animate(1000,(p,t)=>{scene('normal',t,p);for(let i=0;i<10;i++){const k=clamp((p-i*.035)/.5),s=ease(k)*.38;egg(150+i%5*100,265+Math.floor(i/5)*130+(1-ease(k))*20,0,0,0,'normal',s)}})}
for(let i=0;i<list.length;i++){if(skipRequested)break;await hatch(list[i],i,list.length)}
list.forEach((f,i)=>{const item=document.createElement('div');item.className='fl-item';item.dataset.rarity=f.rarity;item.style.animationDelay=(reduced?0:i*.055)+'s';const cv=document.createElement('canvas');cv.width=160;cv.height=160;const c=cv.getContext('2d');animal(c,80,93,1.65,f,f.rarity==='unique');const name=document.createElement('span');name.textContent=f.name;const tag=document.createElement('b');tag.textContent=(f.rarity==='unique'?'왕관 · ':f.rarity==='rare'?'별빛 · ':'기본 · ')+modes[f.rarity].label;item.append(cv,name,tag);results.append(item)});
stage.classList.add('fl-hidden');skip.classList.add('fl-hidden');results.className='fl-results'+(count===1?' single':'');status.textContent=count===10?'친구 10명을 만났어요!':modes[list[0].rarity].label+' 친구를 만났어요!';controls.classList.add('fl-hidden');again.classList.remove('fl-hidden');picker.disabled=false;busy=false;
}
controls.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>start(Number(b.dataset.count))));skip.addEventListener('click',()=>{skipRequested=true;skip.disabled=true});again.addEventListener('click',()=>{results.classList.add('fl-hidden');again.classList.add('fl-hidden');controls.classList.remove('fl-hidden');controls.querySelectorAll('button').forEach(b=>b.disabled=false);stage.classList.remove('fl-hidden');skip.disabled=false;sequence.replaceChildren();status.textContent='어떤 친구를 다시 만나볼까요?';idle()});idle();
})();
</script>
</div>

</body>

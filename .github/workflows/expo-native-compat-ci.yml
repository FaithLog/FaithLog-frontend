name: Expo Native Compatibility CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - package.json
      - package-lock.json
      - app.config.js
      - app.json
      - plugins/**
      - modules/**
      - .github/workflows/expo-native-compat-ci.yml
  push:
    branches: [develop, main]
    paths:
      - package.json
      - package-lock.json
      - app.config.js
      - app.json
      - plugins/**
      - modules/**
      - .github/workflows/expo-native-compat-ci.yml

permissions:
  contents: read

jobs:
  expo-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 26 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm

      - name: Install exact native dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify matching Expo native modules
        run: |
          npx expo install --check
          npx expo-doctor@latest

      - name: Produce Android JS bundle
        run: npx expo export --platform android --output-dir /tmp/faithlog-expo-android

      - name: Produce iOS JS bundle
        run: npx expo export --platform ios --output-dir /tmp/faithlog-expo-ios

      - name: Prepare disposable Firebase config for prebuild-only smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,plistlib,tempfile
          from pathlib import Path
          temp=Path(tempfile.mkdtemp(prefix='faithlog-native-config-qa-'))
          android={
            "project_info":{"project_number":"123456789012","project_id":"faithlog-qa-synthetic","storage_bucket":"faithlog-qa-synthetic.appspot.com"},
            "client":[{
              "client_info":{"mobilesdk_app_id":"1:123456789012:android:001122334455","android_client_info":{"package_name":"com.faithlog.app"}},
              "oauth_client":[],"api_key":[{"current_key":"fake-test-only-key"}],
              "services":{"appinvite_service":{"other_platform_oauth_client":[]}}
            }],
            "configuration_version":"1"
          }
          (temp/'google-services.json').write_text(json.dumps(android))
          ios={
            "API_KEY":"fake-test-only-key","GCM_SENDER_ID":"123456789012",
            "GOOGLE_APP_ID":"1:123456789012:ios:001122334455","PROJECT_ID":"faithlog-qa-synthetic",
            "BUNDLE_ID":"com.faithlog.app","PLIST_VERSION":"1",
            "IS_ANALYTICS_ENABLED":False,"IS_ADS_ENABLED":False
          }
          with (temp/'GoogleService-Info.plist').open('wb') as out:plistlib.dump(ios,out)
          with open(os.environ['GITHUB_ENV'],'a') as out:
            out.write('GOOGLE_SERVICES_JSON_PATH='+str(temp/'google-services.json')+'\n')
            out.write('GOOGLE_SERVICE_INFO_PLIST_PATH='+str(temp/'GoogleService-Info.plist')+'\n')
            out.write('EXPO_PUBLIC_APP_ENV=preview\n')
          PY

      - name: Generate Android native project (synthetic Firebase only)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Generate iOS native project (synthetic Firebase only)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Guard native iOS SPM linkage before release
        run: |
          node - <<'NODE'
          const props=require('./ios/Podfile.properties.json');
          if(props['ios.useFrameworks']!=='dynamic'){
            throw new Error('RNFirebase 26 SPM requires ios.useFrameworks=dynamic');
          }
          console.log('iOS Firebase 26 SPM dynamic linkage is configured');
          NODE


      - name: Verify EAS post-install Crashlytics plist path
        env:
          EAS_BUILD_PLATFORM: ios
        run: |
          node scripts/stage-ios-firebase-plist.js
          test -s ios/GoogleService-Info.plist
          echo "Crashlytics Firebase plist is staged at ios root"

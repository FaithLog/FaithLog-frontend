name: Expo Native Compatibility CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - package.json
      - package-lock.json
      - app.config.js
      - app.json
      - plugins/**
      - modules/**
      - .github/workflows/expo-native-compat-ci.yml
  push:
    branches: [develop, main]
    paths:
      - package.json
      - package-lock.json
      - app.config.js
      - app.json
      - plugins/**
      - modules/**
      - .github/workflows/expo-native-compat-ci.yml

permissions:
  contents: read

jobs:
  expo-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 26 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm

      - name: Install exact native dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify matching Expo native modules
        run: |
          npx expo install --check
          npx expo-doctor@latest

      - name: Produce Android JS bundle
        run: npx expo export --platform android --output-dir /tmp/faithlog-expo-android

      - name: Produce iOS JS bundle
        run: npx expo export --platform ios --output-dir /tmp/faithlog-expo-ios

      - name: Generate Android native project (no credentials)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Generate iOS native project (no credentials)
        run: npx expo prebuild --platform ios --clean --no-install
